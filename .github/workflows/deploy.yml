name: CI and GitHub Pages

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Gate: nothing publishes unless typecheck, tests and build all pass.
  # The previous version of this workflow ran `npm run build || true`, which meant a
  # broken build still deployed. A green badge that cannot go red is worse than none.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Typecheck
        run: npm run typecheck

      # Includes tests/ledger.spec.ts, which fails the build if any capability is
      # marked REAL without a test that actually runs, and the integration suite,
      # which runs against a real in-process Postgres.
      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  deploy-pages:
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      # IMPORTANT — what GitHub Pages can and cannot host.
      #
      # KTN is a dynamic application: 66 API routes, cookie-based auth, middleware, and
      # a PostgreSQL database. Every route except `/` is server-rendered on demand.
      # GitHub Pages serves static files only and runs no server code, so it CANNOT host
      # the application. Signing in, searching, the dashboard and every API route are
      # impossible here by construction, not by configuration.
      #
      # What is published below is exactly one thing: the statically prerendered public
      # landing page, plus the capability ledger as machine-readable JSON. The landing
      # page renders the ledger at build time, so this surface cannot claim a capability
      # the ledger does not mark REAL.
      #
      # The full application belongs on a Node host (Vercel or equivalent) with
      # DATABASE_URL configured.
      - name: Build landing page and ledger
        env:
          NEXT_PUBLIC_BASE_PATH: /Official
          # Prisma requires a syntactically valid URL to generate and build. No query
          # runs during the static build of `/`; this value is never connected to.
          DATABASE_URL: "postgresql://build:build@localhost:5432/build?schema=public"
          DIRECT_URL: "postgresql://build:build@localhost:5432/build?schema=public"
        run: npm run build

      - name: Assemble Pages artifact
        run: |
          set -euo pipefail
          mkdir -p public_site

          # The prerendered landing page. If it is missing, fail — do not substitute a
          # placeholder that claims the site is something it is not.
          if [ ! -f ".next/server/app/index.html" ]; then
            echo "::error::Prerendered landing page not found. Refusing to publish a placeholder."
            exit 1
          fi
          cp .next/server/app/index.html public_site/index.html

          # Static assets, so the published page is styled rather than raw HTML.
          mkdir -p public_site/_next
          cp -r .next/static public_site/_next/static
          if [ -d "public" ]; then cp -r public/. public_site/ 2>/dev/null || true; fi

          # Publish the ledger itself so the claim surface is independently checkable.
          cp capability-ledger.json public_site/capability-ledger.json

          # GitHub Pages would otherwise run the output through Jekyll and drop _next.
          touch public_site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public_site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
