<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KTN - Page Redirecting...</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: #090d16;
      color: #f8fafc;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      text-align: center;
    }
    .card {
      background: #131b2e;
      border: 1px solid #1e293b;
      padding: 3rem;
      border-radius: 1.5rem;
      max-width: 550px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }
    .badge {
      display: inline-block;
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid rgba(56, 189, 248, 0.2);
      color: #38bdf8;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 0.25rem 0.75rem;
      border-radius: 9999px;
      margin-bottom: 1.5rem;
    }
    h1 {
      font-size: 2rem;
      font-weight: 800;
      margin-bottom: 1rem;
      color: #f8fafc;
    }
    p {
      font-size: 1rem;
      color: #94a3b8;
      line-height: 1.6;
      margin-bottom: 2rem;
    }
    .btn {
      display: inline-block;
      background: #2563eb;
      color: #fff;
      text-decoration: none;
      padding: 0.75rem 1.5rem;
      border-radius: 0.5rem;
      font-weight: 600;
      transition: all 0.2s;
    }
    .btn:hover {
      background: #1d4ed8;
    }
  </style>
  <script>
    // GitHub Pages SPA Redirect Script
    const path = window.location.pathname;
    if (path && path !== '/Official/' && path !== '/') {
      setTimeout(function() {
        window.location.href = '/Official/';
      }, 1500);
    }
  </script>
</head>
<body>
  <div class="card">
    <div class="badge">KTN ENTERPRISE PLATFORM</div>
    <h1>Redirecting to Knowledge Network</h1>
    <p>Navigating to the Knowledge Translation Network workspace...</p>
    <a href="/Official/" class="btn">Return to KTN Home</a>
  </div>
</body>
</html>
